name: Skeleton validation

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/validate-skeleton.sh tests/test-skeleton.sh
      - run: ./tests/test-skeleton.sh
      - run: git diff --check
